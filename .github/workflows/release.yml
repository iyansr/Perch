name: Release

run-name: "Perch ${{ inputs.version || github.ref_name }} #${{ github.run_number }}"

# Three ways in, one build: push a `v<version>` tag, merge the Changesets version PR (changesets.yml
# calls this workflow), or run it by hand. A version with a suffix, e.g. 0.2.0-beta.1, is a pre-release.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      version:
        description: "Version, e.g. 0.1.0 (tagged v<version>)"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.0 or 0.2.0-beta.1 (tagged v<version>)"
        type: string
        required: true
      cask_only:
        description: "Only push the Homebrew cask for an already published stable release (retry after a tap failure)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    # Two runs for one version would race to create the same release.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the build number is the commit count. Run numbers differ per trigger, since
          # a called workflow counts the caller's runs, so they could go backwards.
          fetch-depth: 0

      - name: Resolve version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          CASK_ONLY: ${{ inputs.cask_only == true }}
        run: |
          # A tag push has no inputs; its ref name is the tag.
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version '$VERSION' is not semver, e.g. 0.1.0 or 0.2.0-beta.1"
            exit 1
          fi
          TAG="v$VERSION"
          PUBLISHED="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq 'if .isDraft then "draft" elif .isPrerelease then "prerelease" else "stable" end' 2>/dev/null || true)"
          if [ "$CASK_ONLY" = "true" ]; then
            # Retry only the tap push, from the DMG the published release already serves.
            if [ "$PUBLISHED" != "stable" ]; then
              echo "::error::cask_only needs a published stable release $TAG (found: ${PUBLISHED:-none})"
              exit 1
            fi
            mkdir -p dist
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "Perch-$VERSION.dmg" --dir dist
          # Only a published release blocks; a draft left by a failed run is replaced when publishing.
          elif [ -n "$PUBLISHED" ] && [ "$PUBLISHED" != "draft" ]; then
            echo "::error::Release $TAG already exists. To retry only the Homebrew cask, run this workflow with cask_only."
            exit 1
          fi
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; fi
          {
            echo "VERSION=$VERSION"
            echo "TAG=$TAG"
            echo "DMG=dist/Perch-$VERSION.dmg"
            echo "ZIP=dist/Perch-$VERSION.zip"
            echo "PRERELEASE=$PRERELEASE"
            echo "CASK_ONLY=$CASK_ONLY"
          } >> "$GITHUB_ENV"
          echo "Releasing $TAG (pre-release: $PRERELEASE)"

      - name: Select Xcode 27
        if: env.CASK_ONLY != 'true'
        run: |
          # Real folders only: an image's Xcode_27.N.app symlink can point at a release candidate.
          XCODE_PATH="$(find -E /Applications -maxdepth 1 -type d -regex '.*/Xcode_27(\.[0-9]+)*\.app' | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="$(xcode-select -p | sed 's|/Contents/Developer$||')"
            echo "::warning::No Xcode_27.x folder found; using the image default $XCODE_PATH"
          fi
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE_PATH/Contents/Developer" xcodebuild -version

      # The SAME certificate on every release is what keeps users' privacy grants across updates.
      # Scripts/verify-signature.sh fails the run if a different one is imported.
      - name: Import signing identity
        if: env.CASK_ONLY != 'true'
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::SIGNING_P12_BASE64 and SIGNING_P12_PASSWORD must be set. See docs/release.md."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/identity.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/identity.p12"
          # Lets codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Prepend to the search list so xcodebuild finds "Perch Self-Signed". xargs unquotes the
          # existing entries, which `security` prints in double quotes.
          security list-keychains -d user | xargs security list-keychains -d user -s "$KEYCHAIN"
          security find-identity -p codesigning "$KEYCHAIN"

      - name: Resolve build number
        if: env.CASK_ONLY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Build numbers must increase even across release branches and repeated releases of one commit.
          BUILD="$(git rev-list --count HEAD)"
          LATEST_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [ -n "$LATEST_TAG" ]; then
            PREV_NAME="Perch-${LATEST_TAG#v}.zip"
            HAS_ZIP="$(gh release view "$LATEST_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[] | select(.name == \"$PREV_NAME\") | .name")"
            if [ -n "$HAS_ZIP" ]; then
              mkdir -p "$RUNNER_TEMP/latest"
              gh release download "$LATEST_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$PREV_NAME" --dir "$RUNNER_TEMP/latest"
              unzip -p "$RUNNER_TEMP/latest/$PREV_NAME" 'Perch.app/Contents/Info.plist' > "$RUNNER_TEMP/prev.plist"
              PREV="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/prev.plist")"
              if ! [[ "$PREV" =~ ^[0-9]{1,18}$ ]]; then
                echo "::error::Latest stable ZIP has an invalid build number"
                exit 1
              fi
              if [ "$PREV" -ge "$BUILD" ]; then BUILD=$((10#$PREV + 1)); fi
              echo "Latest stable build is $PREV"
            else
              echo "Latest stable predates ZIP updates; using the commit count."
            fi
          fi
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "Build number $BUILD"

      - name: Build, verify and package
        if: env.CASK_ONLY != 'true'
        run: ./Scripts/build-release.sh "$VERSION" "$BUILD_NUMBER"

      - uses: actions/upload-artifact@v7
        if: env.CASK_ONLY != 'true'
        with:
          name: Perch-${{ env.VERSION }}
          path: |
            ${{ env.DMG }}
            ${{ env.ZIP }}
          if-no-files-found: error

      - name: Compose release notes
        if: env.CASK_ONLY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Changesets writes CHANGELOG.md; its section for this version is the curated changelog.
          # Without one (a hand-pushed tag), fall back to GitHub's notes. The tag may not exist yet, so
          # generate-notes takes the commit it will point at.
          if [ -f CHANGELOG.md ] && awk -v v="$VERSION" '$0 == "## " v {found=1} END {exit !found}' CHANGELOG.md; then
            awk -v v="$VERSION" '$0 == "## " v {on=1; next} on && /^## / {exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body > "$RUNNER_TEMP/notes.md"
          fi
          SHA256="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          ZIP_SHA256="$(shasum -a 256 "$ZIP" | awk '{print $1}')"
          cat >> "$RUNNER_TEMP/notes.md" <<EOF

          ## Install

          With Homebrew, which clears the quarantine flag on every install and upgrade:

          \`\`\`sh
          brew trust --tap iyansr/perch
          brew install --cask iyansr/perch/perch
          \`\`\`

          Or download \`Perch-$VERSION.dmg\` and drag Perch to Applications. Perch is self-signed, not notarized, so clear the quarantine flag after installing each release:

          \`\`\`sh
          xattr -dr com.apple.quarantine /Applications/Perch.app
          \`\`\`

          Requires macOS 26 or later. Universal: Apple silicon and Intel.

          Perch checks for stable updates daily and asks before it downloads, installs and relaunches. \`Perch-$VERSION.zip\` is the updater's payload; it is not for manual install.

          SHA-256 \`Perch-$VERSION.dmg\`: \`$SHA256\`

          SHA-256 \`Perch-$VERSION.zip\`: \`$ZIP_SHA256\`
          EOF

      # Draft first, publish after every asset is attached: the updater and the website alias never
      # see a release with missing files.
      - name: Publish GitHub Release
        if: env.CASK_ONLY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failed earlier run may have left a draft for this tag; it would block a retry.
          gh release list --repo "$GITHUB_REPOSITORY" --json tagName,isDraft \
            --jq ".[] | select(.isDraft and .tagName == \"$TAG\") | .tagName" | while read -r stale; do
            gh release delete "$stale" --repo "$GITHUB_REPOSITORY" --yes
          done
          FLAGS=()
          LATEST=()
          ASSETS=("$DMG" "$ZIP")
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          else
            # Unversioned copy: the website links releases/latest/download/Perch.dmg, which skips pre-releases.
            cp "$DMG" dist/Perch.dmg
            ASSETS+=(dist/Perch.dmg)
            LATEST=(--latest)
          fi
          gh release create "$TAG" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Perch $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --draft \
            "${FLAGS[@]}"
          # make_latest is ignored while a release is a draft, so mark it when publishing.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${LATEST[@]}"

      # Pre-releases stay off Homebrew: `brew upgrade` would hand them to everyone.
      - name: Update Homebrew cask
        if: env.PRERELEASE != 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set; skipping the cask bump. See docs/release.md."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/iyansr/homebrew-perch.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          ./Scripts/render-cask.sh "$VERSION" "$DMG" > "$RUNNER_TEMP/tap/Casks/perch.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/perch.rb
          if git diff --cached --quiet; then
            echo "Cask already at $VERSION."
          else
            git commit -m "perch $VERSION"
            git push
          fi

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
